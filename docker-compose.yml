version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: medclinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medclinic_db
    ports:
      - "5432:5432"
    volumes:
      - medclinic_pg_data:/var/lib/postgresql/data
volumes:
  medclinic_pg_data: